<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kav &amp; Kev — кабинет точки</title>
<script src="/demo-clock.js"></script>
<link rel="stylesheet" href="/styles.css">
<style>
  .cab { max-width: 880px; margin: 0 auto; padding: 16px; }
  .cab-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .cab-head h1 { margin: 0; font-size: 22px; }
  .cab-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .cab-tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .cab-sku { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .cab-sku.ret { grid-template-columns: 1fr 80px 170px; }
  .cab-sku .m { font-size: 11px; color: var(--muted); }
  .cab-sku.in-matrix .nm::before { content: '★ '; color: var(--gold); }
  .cab-total { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; }
  @media (max-width: 560px) { .cab-sku.ret { grid-template-columns: 1fr 70px; } .cab-sku.ret select { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="cab">
  <div class="cab-head">
    <div><div class="muted" style="font-size:13px"><img src="/logo.png" alt="" class="kk-logo-sm" onerror="this.remove()">Kav &amp; Kev · кабинет точки</div><h1 id="cab-name">…</h1></div>
    <button type="button" class="btn-secondary" id="cab-logout">Выйти</button>
  </div>
  <div id="cab-info" class="van-kpis"></div>
  <div class="cab-tabs">
    <button type="button" class="btn-secondary active" data-tab="order">🛒 Заказать</button>
    <button type="button" class="btn-secondary" data-tab="return">↩ Возврат</button>
    <button type="button" class="btn-secondary" data-tab="orders">Мои заявки</button>
    <button type="button" class="btn-secondary" data-tab="history">Поставки</button>
  </div>
  <div id="cab-body" class="van-panel"></div>
</div>
<div id="modal-root"></div>
<script src="/cabinet.js"></script>
<script src="/demo.js"></script>
</body>
</html>
